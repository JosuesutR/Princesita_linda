<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRINCESITA DE MI CORAZON</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      height: 100vh;
      background: linear-gradient(to top, #fce2ec, #c9e7f7, #f8f1ff);
      font-family: 'Arial Rounded MT Bold', sans-serif;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .elemento {
      position: absolute;
      transform: translate(-50%, -50%);
      animation: floatUp 5s ease-out forwards;
      z-index: 2;
    }
    @keyframes floatUp {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translate(-50%, -250%) scale(1); opacity: 0; }
    }
    .message {
      position: absolute;
      color: #444;
      font-size: 18px;
      background: rgba(255,255,255,0.8);
      padding: 6px 12px;
      border-radius: 12px;
      white-space: nowrap;
      animation: rise 4s ease-out forwards;
      z-index: 3;
    }
    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-150px); opacity: 0; }
    }
  </style>
</head>
<body>
  <canvas id="petalos"></canvas>
  <script>
    const canvas = document.getElementById('petalos');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Petalo {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * -height;
        this.size = 10 + Math.random() * 15;
        this.speed = 1 + Math.random() * 2;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = 0.01 + Math.random() * 0.03;
      }
      update() {
        this.y += this.speed;
        this.angle += this.spin;
        if (this.y > height) this.reset();
      }
      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.fillStyle = 'rgba(255,182,193,0.7)';
        ctx.beginPath();
        ctx.ellipse(0, 0, this.size * 0.6, this.size, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    const petalos = Array.from({length: 60}, () => new Petalo());
    function animar() {
      ctx.clearRect(0,0,width,height);
      petalos.forEach(p => {p.update(); p.draw();});
      requestAnimationFrame(animar);
    }
    animar();

    const mensajes = [
      "HOY TE VES TAN HERMOSA",
      "TIENES UNOS OJOS TAN PRECIOSOS",
      "TU SONRISA ES LA MAS LINDA",
      "ERES LA MAS BONITA",
      "ME GUSTAN MUCHO TUS OJOOOS",
      "ERES TAN PRECIOSA",
      "ERES TAN GUAPAAA",
      "MA HACES FELIZ",
      "ILY PRINCESITA"
    ];

    function crearElemento(x, y) {
      const el = document.createElement('div');
      el.className = 'elemento';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.innerHTML = generarSVG();
      document.body.appendChild(el);
      setTimeout(()=> el.remove(), 5000);
    }

    function generarSVG() {
      const tipo = Math.floor(Math.random()*6);
      switch(tipo) {
        case 0: // Tulipán
          return `<svg width="50" height="80" viewBox="0 0 50 80">
            <path d="M25 30 C20 10, 10 20, 25 5 C40 20, 30 10, 25 30 Z" fill="#ff4d6d"/>
            <rect x="23" y="30" width="4" height="40" fill="#3c8d0d"/>
          </svg>`;
        case 1: // Anémona
          let petals = '';
          for(let i=0;i<8;i++){
            let angle = (i*45);
            petals += `<ellipse cx="25" cy="25" rx="12" ry="20" fill="#9370db" transform="rotate(${angle} 25 25)"/>`;
          }
          return `<svg width="60" height="60" viewBox="0 0 50 50">${petals}<circle cx="25" cy="25" r="8" fill="#ffd700"/></svg>`;
        case 2: // Girasol
          let girasol = '';
          for(let i=0;i<12;i++){
            let angle = (i*30);
            girasol += `<ellipse cx="25" cy="25" rx="8" ry="20" fill="#f4a300" transform="rotate(${angle} 25 25)"/>`;
          }
          return `<svg width="60" height="60" viewBox="0 0 50 50">${girasol}<circle cx="25" cy="25" r="10" fill="#5a381e"/></svg>`;
        case 3: // Rosa
          return `<svg width="60" height="60" viewBox="0 0 60 60">
            <circle cx="30" cy="30" r="10" fill="#ff2d55"/>
            <circle cx="30" cy="20" r="8" fill="#ff4d6d"/>
            <circle cx="40" cy="30" r="8" fill="#ff4d6d"/>
            <circle cx="20" cy="30" r="8" fill="#ff4d6d"/>
            <circle cx="30" cy="40" r="8" fill="#ff4d6d"/>
          </svg>`;
        case 4: // Clavel
          let clavel = '';
          for(let i=0;i<10;i++){
            let angle = (i*36);
            clavel += `<circle cx="25" cy="15" r="6" fill="#e75480" transform="rotate(${angle} 25 25) translate(0,-12)"/>`;
          }
          return `<svg width="60" height="60" viewBox="0 0 50 50">${clavel}<circle cx="25" cy="25" r="8" fill="#e75480"/></svg>`;
        default: // Corazón
          return `<svg width="50" height="50" viewBox="0 0 32 29.6">
            <path d="M23.6,0c-2.7,0-5.1,1.2-6.6,3.2C15.5,1.2,13.1,0,10.4,0C4.7,0,0,4.7,0,10.4c0,11.3,16.9,19.2,16.9,19.2S33.8,21.7,33.8,10.4C33.8,4.7,29.1,0,23.6,0z" fill="#ff4d6d"/>
          </svg>`;
      }
    }

    function crearMensaje(x, y) {
      const msg = document.createElement('div');
      msg.className = 'message';
      msg.style.left = x + 'px';
      msg.style.top = y + 'px';
      msg.textContent = mensajes[Math.floor(Math.random()*mensajes.length)];
      document.body.appendChild(msg);
      setTimeout(()=> msg.remove(), 4000);
    }

    window.addEventListener('pointerdown', e => {
      crearElemento(e.clientX, e.clientY);
      crearMensaje(e.clientX, e.clientY - 40);
    });
  </script>
</body>
</html>
